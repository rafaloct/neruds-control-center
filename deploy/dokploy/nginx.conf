server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        application/wasm image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Flutter web emite assets com hash no nome: cache agressivo é seguro.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /canvaskit/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalidado: nova versão chega sem hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # main.dart.js também sempre revalidado — sem isso o browser serve
    # o bundle antigo por até 4h após cada deploy (main.dart.js não
    # tem hash no nome).
    location = /main.dart.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — rotas do app resolvem no index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
