[project]
name = "bridge"
version = "0.3.3"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pywin32>=311 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
